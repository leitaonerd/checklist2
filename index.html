<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokémon × Checklist</title>
  
  <!-- BwGradual Alternative: Using Inter with CV11 for that clean geometric look -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Oakâme Tailwind Configuration -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'walnut-ink': '#403a34',
            'linen-canvas': '#f6f1eb',
            'charcoal-note': '#333333',
          },
          fontFamily: {
            'bwgradual': ['Inter', 'sans-serif'], 
          }
        }
      }
    }
  </script>
  
  <style>
    body {
      background-color: #f6f1eb;
      font-feature-settings: "cv11", "ss01", "tnum";
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="text-walnut-ink min-h-screen flex flex-col">

  <!-- Top Navigation Bar -->
  <header class="w-full border-b border-walnut-ink h-[60px] md:h-[80px] flex items-center justify-between px-5">
    <a href="#" class="font-bwgradual font-medium text-[18px] underline decoration-1 underline-offset-4 hover:opacity-70 transition-opacity">checklist</a>
    <div class="font-bwgradual font-regular text-[12px] tracking-[0.083em] uppercase hidden md:block">abas</div>
    <div class="font-bwgradual font-regular text-[12px] tracking-[0.083em] uppercase flex gap-[20px] md:gap-[30px]">
      <button onclick="exportCollection()" class="hover:opacity-70 transition-opacity uppercase tracking-[0.083em]">exportar</button>
      <a href="#" class="hover:opacity-70 transition-opacity">contato</a>
    </div>
  </header>

  <!-- Bordered Square Tab Bar -->
  <nav id="tab-bar" class="w-full border-b border-walnut-ink flex overflow-x-auto no-scrollbar bg-linen-canvas">
    <!-- Tabs injected via JS -->
  </nav>

  <!-- Main Content Area -->
  <main class="max-w-[1600px] w-full mx-auto px-5 py-[60px] md:py-[120px] flex-grow">
    
    <!-- Header Block (Eyebrow, Title, Stats, and Sort Action) -->
    <div class="flex flex-col md:flex-row md:items-end justify-between gap-6 mb-[60px] md:mb-[120px]">
      <div>
        <span id="eyebrow" class="block font-bwgradual font-medium text-[10px] tracking-[0.1em] uppercase text-walnut-ink mb-4">
          Collection Focus
        </span>
        <h2 id="display-title" class="font-bwgradual font-medium text-[40px] md:text-[60px] leading-[1.2] tracking-[-3.36px] uppercase text-walnut-ink">
          Loading...
        </h2>
        <div id="stats" class="font-bwgradual font-regular text-[12px] tracking-[0.083em] uppercase text-charcoal-note mt-4">
          0/0 COLLECTED — 0 FOIL
        </div>
      </div>

      <!-- Pill Action Button for Sorting -->
      <button onclick="toggleSort()" id="sort-btn" class="px-5 py-2 border border-walnut-ink rounded-full hover:bg-walnut-ink hover:text-linen-canvas transition-colors flex-shrink-0">
        <span class="font-bwgradual font-medium text-[10px] tracking-[0.1em] uppercase">
          ORDER: OLDEST FIRST
        </span>
      </button>
    </div>

    <!-- 6-Column Card Grid -->
    <div id="grid-container" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-[20px]">
      <!-- Cards injected via JS -->
    </div>
    
  </main>

  <script>
    // Configuration & State
    const tabs = [
      'Sekio', 'Asako Ito', 'Ooyama', 'Ryoma Uratsuka', 
      'Yuka Morii', 'Tomokazu Komiya', 
      'Clefairy', 'Dedenne', 'Wooper', 'Tandemaus & Maushold'
    ];
    
    let db = [];
    let activeTab = tabs[0];
    let sortAscending = true; // true = Oldest to Newest
    
    // Load local storage collection (0 = None, 1 = Normal, 2 = Foil)
    let collection = {};

    // DOM Elements
    const tabBar = document.getElementById('tab-bar');
    const gridContainer = document.getElementById('grid-container');
    const displayTitle = document.getElementById('display-title');
    const eyebrow = document.getElementById('eyebrow');
    const statsEl = document.getElementById('stats');
    const sortBtnText = document.querySelector('#sort-btn span');

    // Initialization
    async function init() {
    try {
        // Fetch both the Limitless catalog and your personal collection state
        const [dbResponse, colResponse] = await Promise.all([
        fetch('pokemon_db.json'),
        fetch('collection.json').catch(() => ({ json: () => ({}) })) // Fails safely if collection.json doesn't exist yet
        ]);

        db = await dbResponse.json();
        const serverCollection = await colResponse.json();
        
        // Merge server state with any newer local clicks
        const localCollection = JSON.parse(localStorage.getItem('oakame_pokemon_collection')) || {};
        collection = { ...serverCollection, ...localCollection };

        renderTabs();
        updateView();
    } catch (error) {
        console.error('Error loading databases:', error);
        displayTitle.innerText = "Error Loading Database";
        }
    }

    // Replace with your actual GitHub username and repo name
    const GITHUB_REPO = "leitaonerd/checklist2"; 

    window.exportCollection = async () => {
    // 1. Get or request the token
    let token = localStorage.getItem('gh_pat_token');
    if (!token) {
        token = prompt("🔒 Enter your GitHub Personal Access Token to sync:");
        if (!token) return; // User cancelled
        localStorage.setItem('gh_pat_token', token);
    }

    // Change button text to show activity
    const exportBtn = document.getElementById('export-btn');
    exportBtn.innerText = "SYNCING...";

    try {
        const fileUrl = `https://api.github.com/repos/${GITHUB_REPO}/contents/collection.json`;
        
        // 2. We must get the file's current "SHA" hash first. GitHub requires this to overwrite a file.
        const getResponse = await fetch(fileUrl, {
        headers: { "Authorization": `token ${token}` }
        });
        
        let fileSha = null;
        if (getResponse.ok) {
        const data = await getResponse.json();
        fileSha = data.sha;
        } else if (getResponse.status !== 404) {
        throw new Error("Could not fetch file SHA.");
        }

        // 3. Prepare the new JSON payload (GitHub requires Base64 encoding)
        const jsonString = JSON.stringify(collection, null, 2);
        // Safe Base64 encoding for browsers that handles special characters properly
        const base64Content = btoa(unescape(encodeURIComponent(jsonString)));

        // 4. Send the PUT request to commit the file
        const putResponse = await fetch(fileUrl, {
        method: "PUT",
        headers: {
            "Authorization": `token ${token}`,
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            message: "Sync collection state via Web App",
            content: base64Content,
            sha: fileSha // Omit if creating the file for the very first time
        })
        });

        if (putResponse.ok) {
        exportBtn.innerText = "SYNCED ✓";
        setTimeout(() => exportBtn.innerText = "EXPORTAR", 2000);
        } else {
        const errorData = await putResponse.json();
        // If the token is invalid or expired, clear it so the user is prompted again next time
        if (errorData.message === "Bad credentials") {
            localStorage.removeItem('gh_pat_token');
            alert("Token invalid or expired. Please click export again to enter a new token.");
        } else {
            alert(`GitHub API Error: ${errorData.message}`);
        }
        exportBtn.innerText = "EXPORTAR";
        }
    } catch (error) {
        console.error(error);
        alert("Network error while trying to sync.");
        exportBtn.innerText = "EXPORTAR";
    }
    };

    function renderTabs() {
      tabBar.innerHTML = tabs.map(tab => {
        const isActive = tab === activeTab;
        const baseClasses = "px-6 py-4 border-r border-walnut-ink flex-shrink-0 cursor-pointer transition-colors";
        const stateClasses = isActive 
          ? "bg-walnut-ink text-linen-canvas" 
          : "hover:bg-walnut-ink hover:text-linen-canvas text-walnut-ink";
          
        return `
          <button onclick="setActiveTab('${tab}')" class="${baseClasses} ${stateClasses}">
            <span class="font-bwgradual font-medium text-[12px] tracking-[0.083em] uppercase">
              ${tab}
            </span>
          </button>
        `;
      }).join('');
    }

    window.setActiveTab = (tab) => {
      activeTab = tab;
      renderTabs();
      updateView();
    };

    window.toggleSort = () => {
      sortAscending = !sortAscending;
      sortBtnText.innerText = sortAscending ? 'ORDER: OLDEST FIRST' : 'ORDER: NEWEST FIRST';
      updateView();
    };

    window.toggleCardState = (cardId) => {
      const currentState = collection[cardId] || 0;
      collection[cardId] = (currentState + 1) % 3; // Cycles 0 -> 1 -> 2 -> 0
      localStorage.setItem('oakame_pokemon_collection', JSON.stringify(collection));
      updateView(); // Re-render the grid to show new state
    };

    function updateView() {
      displayTitle.innerText = activeTab;
      const isArtist = ['Sekio', 'Asako Ito', 'Ooyama', 'Ryoma Uratsuka', 'Yuka Morii', 'Tomokazu Komiya'].includes(activeTab);
      eyebrow.innerText = isArtist ? "Artist Focus" : "Species Focus";

      // 1. Filter
      let filteredCards = db.filter(card => {
        const query = activeTab.toLowerCase();
        const tagsLower = card.tags.map(t => t.toLowerCase());
        const titleLower = card.displayTitle.toLowerCase();
        
        if (query === 'tandemaus & maushold') {
          return titleLower.includes('tandemaus') || titleLower.includes('maushold') || 
                 tagsLower.includes('tandemaus') || tagsLower.includes('maushold');
        }
        return tagsLower.includes(query) || titleLower.includes(query);
      });

      // 2. Sort Logic (Reverses sets, but keeps numerical order within the set)
      const uniqueSets = [...new Set(filteredCards.map(c => c.tags[1]))]; 
      if (!sortAscending) {
        uniqueSets.reverse(); // Newest sets first
      }
      
      let sortedCards = [];
      uniqueSets.forEach(setTag => {
        let cardsInSet = filteredCards.filter(c => c.tags[1] === setTag);
        
        // --- THE BULLETPROOF SORT ---
        cardsInSet.sort((a, b) => {
          // 1. If your JSON has the isolated 'cardNumber' property we added, use it directly!
          if (a.cardNumber && b.cardNumber) {
            return a.cardNumber.localeCompare(b.cardNumber, undefined, { numeric: true });
          }

          // 2. Fallback: Split the label by ANY possible divider (bullet, hyphen, or em-dash)
          const getNumStr = (label) => {
            const parts = label.split(/[-•—]/);
            // Grab the very last piece (e.g., " 238/193") and trim the spaces
            return parts[parts.length - 1].trim(); 
          };
          
          // localeCompare with 'numeric: true' naturally understands how to sort 
          // fractional strings like "12/100" vs "2/100" and promo strings like "TG04".
          return getNumStr(a.eyebrowLabel).localeCompare(getNumStr(b.eyebrowLabel), undefined, { numeric: true });
        });
        // ----------------------------

        sortedCards.push(...cardsInSet);
      });
      filteredCards = sortedCards;

      // 3. Stats Calculation
      let total = filteredCards.length;
      let collected = 0;
      let foil = 0;

      // 4. Render Grid
      gridContainer.innerHTML = filteredCards.map(card => {
        const state = collection[card.id] || 0;
        
        if (state > 0) collected++;
        if (state === 2) foil++;

        // Determine Oakâme Styling based on collection state
        let bgClass = "bg-linen-canvas";
        let hoverLabelBg = "bg-linen-canvas";
        let textHover = "text-walnut-ink";
        let borderHover = "border-walnut-ink";
        let statusBadge = "";

        if (state === 1) {
          // Normal Collected: Subtle background tint
          bgClass = "bg-[#d9cfc1]"; 
        } else if (state === 2) {
          // Foil Collected: Heavy Walnut Ink inversion
          bgClass = "bg-walnut-ink";
          hoverLabelBg = "bg-walnut-ink";
          textHover = "text-linen-canvas";
          borderHover = "border-linen-canvas";
          statusBadge = `
            <div class="absolute top-3 right-3 border border-linen-canvas text-linen-canvas px-2 py-1">
              <span class="block font-bwgradual font-medium text-[8px] tracking-[0.1em] uppercase">Foil</span>
            </div>
          `;
        }

        return `
          <article onclick="toggleCardState('${card.id}')" class="aspect-square border border-walnut-ink ${bgClass} flex items-center justify-center relative group cursor-pointer transition-colors duration-300">
            <img 
              src="${card.imageUrl}" 
              alt="${card.displayTitle}"
              loading="lazy"
              class="w-full h-full object-contain p-4 transition-transform duration-300 group-hover:scale-105" 
            />
            
            ${statusBadge}

            <!-- Hover label -->
            <div class="absolute bottom-0 w-full border-t ${borderHover} ${hoverLabelBg} p-2 opacity-0 group-hover:opacity-100 transition-opacity">
              <span class="block text-center font-bwgradual font-medium text-[10px] tracking-[0.1em] uppercase ${textHover}">
                ${card.eyebrowLabel}
              </span>
            </div>
          </article>
        `;
      }).join('');

      // Update Stats UI
      statsEl.innerText = `${collected}/${total} COLLECTED — ${foil} FOIL`;
    }

    // Boot
    init();
  </script>
</body>
</html>
