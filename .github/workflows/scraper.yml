name: Update Pokémon Database

on:
  # Runs automatically at 00:00 every Sunday
  schedule:
    - cron: '0 0 * * 0'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Limitless scraper
        # Assuming your python file is named scraper.py in the root directory
        run: python scraper.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add pokemon_db.json
          
          # This checks if there are actual changes before trying to commit,
          # preventing the workflow from failing if the site hasn't updated.
          git diff --quiet && git diff --staged --quiet || (git commit -m "Database: Auto-update from Limitless TCG" && git push)